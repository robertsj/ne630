processing:
  submission_root: "grades/submissions"
  review_root: "grades/review/f2026"
  runs_root: "grades/review/f2026/runs"
  restricted_root: "grades/review/f2026/restricted"
  run_directory_mode: "0700"
  restricted_directory_mode: "0700"
  private_file_mode: "0600"
  run_layout:
    run_root_pattern: "grades/review/f2026/runs/{run_id}"
    directories: ["events", "manifests", "packets", "dossiers", "reviews", "builds", "reports", "tmp"]
    event_log: "events/events.jsonl"
    human_decision_log: "events/human_decisions.jsonl"
  identifier_policy:
    pseudonym_scope: "PERSON_ACROSS_PILOT"
    pseudonym_pattern: "S[0-9]{3,}"
    submission_record_id_pattern: "HW0[1-4]-S[0-9]{3,}-V[0-9]{2,}"
    source_identifiers_location: "RESTRICTED_IDENTITY_MAP_OR_EXPLICITLY_AUTHORIZED_PRIVATE_PACKET_PDFS"
  canonical_json:
    encoding: "UTF-8"
    unicode_normalization: "NFC"
    sort_object_keys: true
    separators: [",", ":"]
    terminal_newline: true
  source_payload_digest:
    algorithm: "SHA-256"
    definition: "SHA-256 of canonical JSON containing the sorted sanitized logical path, byte count, and byte-level SHA-256 for every top-level source file"
  workflow_stages: ["SELF_TEST", "REFERENCE_FREEZE", "INTAKE", "PREPARE_CALIBRATION", "PRODUCT_REVIEW", "RECONCILIATION", "VALIDATE"]
  storage:
    value: "tracked framework with Git-ignored raw submissions, restricted identity data, and generated run directories"
    source: "User authorization and repository-local grades/README.md"
    adoption_status: "ADOPTED"
  authorized_processing:
    value: "Jeremy Roberts and the current Morrow/OpenClaw Codex pilot session"
    source: "User authorization of steps 1-3 on 2026-09-09"
    adoption_status: "ADOPTED"
  external_services:
    value: "none beyond the current authorized agent session"
    source: "Pilot scope"
    adoption_status: "ADOPTED"
  model_provider:
    value: "record exact provider, model, prompt, and tool versions in each run and review artifact"
    source: "Audit reproducibility requirement"
    adoption_status: "ADOPTED"
  deterministic_tools:
    value: ["Python 3", "zipfile", "file", "bubblewrap", "pdfinfo", "pdftotext", "pdftoppm", "SHA-256"]
    source: "Verified local executables on 2026-09-09"
    adoption_status: "ADOPTED"
  sandbox:
    value: null
    source: "bubblewrap is installed, but no instructor-controlled build wrapper has been verified"
    adoption_status: "UNRESOLVED"
  default_build_status: "NOT_RUN_NO_SANDBOX"
  archive_limits:
    academic_policy_status: "PROPOSED"
    guardrail_status: "ACTIVE"
    source: "Conservative operational guardrails; exceeding them blocks processing but is not an academic finding"
    max_entries: 1000
    max_entry_bytes: 52428800
    max_total_expanded_bytes: 209715200
    max_compression_ratio: 100.0
    max_pdf_bytes_for_text_check: 52428800
    tool_timeout_seconds: 30

