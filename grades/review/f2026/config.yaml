  route_a_required_files:
    value: ["one readable solution PDF"]
    source: "administrivia/syllabus.md"
    adoption_status: "ADOPTED"
  route_b_required_files:
    value: ["solution.tex", "solution.pdf", "discourse.tex", "discourse.pdf", "Makefile"]
    source: "administrivia/syllabus.md"
    adoption_status: "ADOPTED"
  route_b_supporting_artifacts:
    value: "every code, data, figure-source, or other file needed to reproduce the work"
    source: "administrivia/syllabus.md"
    adoption_status: "ADOPTED"
  both_routes_requirements:
    value: ["full problem statements", "each problem begins on a new page", "clearly marked final answers", "traceable reasoning"]
    source: "administrivia/syllabus.md"
    adoption_status: "ADOPTED"
  opening_notice:
    value: |-
      I am working on an NE 630 homework assignment. My instructor permits any use
      of generative AI, including generation of derivations, prose, code, and the
      final solution, provided that I submit the complete visible dialogue.
      Everything in this conversation may be reviewed as part of my work. Do not
      suggest that I hide, delete, summarize, or selectively omit unsuccessful
      attempts or AI assistance. My submission must be a self-contained ZIP
      archive containing a verbatim transcript in `discourse.tex`, a polished
      `solution.tex`, a `Makefile` that builds both PDFs, and every code, data,
      figure-source, or other file needed to reproduce the work. Please use
      explicit filenames and relative paths. I am responsible for checking and
      explaining all submitted content.
    source: "administrivia/syllabus.md"
    adoption_status: "ADOPTED"
  end_marker:
    value: "END OF GRADED DISCOURSE"
    source: "administrivia/syllabus.md"
    adoption_status: "ADOPTED"
  deadline_and_timezone:
    value: null
    source: "Canvas required for assignment-specific deadline"
    adoption_status: "UNRESOLVED"
  late_penalty:
    value: null
    source: "Canvas and instructor decision required"
    adoption_status: "UNRESOLVED"
  repair_window:
    value: null
    source: "Syllabus permits one no-penalty scan/document-formatting resubmission but gives no general repair interval"
